[package]
name = "keydis-inspector"
version = "1.0.0"
edition = "2021"
authors = ["Reija"]
description = "Advanced Windows PE & Keylogger Static Triage Engine for DFIR & Threat Hunting"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
goblin = "0.8"
sha2 = "0.10"