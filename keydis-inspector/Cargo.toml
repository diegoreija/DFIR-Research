[package]
name = "keydis-inspector"
version = "1.1.0"
edition = "2021"
authors = ["Reija"]
description = "Evidence-first malware triage and forensic CLI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
goblin = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
