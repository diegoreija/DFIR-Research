name: KeyDis Inspector CI
on:
  push:
    paths:
      - 'keydis-inspector/**'
      - '.github/workflows/keydis-inspector.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keydis-inspector
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run tests
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Smoke test command line
        run: |
          ./target/release/keydis-inspector --help
          ./target/release/keydis-inspector disasm --help
          ./target/release/keydis-inspector xref --help
          ./target/release/keydis-inspector api-hash --help
          ./target/release/keydis-inspector hash --input Cargo.toml --algorithm sha256
